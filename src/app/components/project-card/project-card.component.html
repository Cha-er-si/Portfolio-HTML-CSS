<div class="card-container">
  <mat-card class="card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{ project().title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>
        {{ project().description }}
      </p>
    </mat-card-content>
    <mat-card-footer class="card-footer">
      <mat-chip-set aria-label="Chihuahua traits">
        @for (skill of project().skills; track $index) {
          <mat-chip>{{ skill }}</mat-chip>
        }
      </mat-chip-set>
    </mat-card-footer>
  </mat-card>
</div>
